name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      # npm, not pnpm: the repository commits `package-lock.json`, and
      # `actions/setup-node` with `cache: pnpm` fails hard when there is no
      # `pnpm-lock.yaml`. That missing lockfile is what broke the first runs —
      # setup-node itself was the failing step, before any build happened.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify (offline mock providers)
        run: npm run verify

      - name: Check the shipped artifact exists
        run: |
          test -f lib/index.js
          grep -q 'export {' lib/index.js
          wc -c lib/index.js

      - name: Package contents
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q 'cordis.patch.yml' pack.txt
          grep -q 'lib/index.js' pack.txt
